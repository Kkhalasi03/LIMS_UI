<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Area Form Modal (Add/Edit) -->
<div class="popup" *ngIf="isFormVisible">
  <div class="popup-content">
    <span class="close" (click)="closeForm()">&times;</span>
    <h2>{{ isEditMode ? 'Edit Area' : 'Add Area' }}</h2>
    <hr />
    <form [formGroup]="areaForm" (ngSubmit)="isEditMode ? onSubmit() : onAddSubmit()">

      <!-- Area ID (Readonly in Edit Mode) -->
      <div class="row mb-3">
        <label for="areaId" class="col-25 col-form-label">Area ID</label>
        <div class="col-75">
          <input
            formControlName="AreaId"
            type="number"
            id="areaId"
            class="form-control"
            placeholder="Area ID"
            [readonly]="isEditMode"
          />
        </div>
      </div>

      <!-- Area Name -->
      <div class="row mb-3">
        <label for="areaName" class="col-25 col-form-label">Area Name</label>
        <div class="col-75">
          <input
            formControlName="AreaName"
            type="text"
            id="areaName"
            class="form-control"
            placeholder="Area Name"
            required
            pattern="^(?!\s*$)[A-Za-z]+(?:[ -][A-Za-z]+)*$"
          />
        </div>
      </div>
      <div *ngIf="areaForm.get('AreaName')?.invalid && areaForm.get('AreaName')?.touched" class="text-danger">
        <div *ngIf="areaForm.get('AreaName')?.hasError('required')">Area Name is required.</div>
        <div *ngIf="areaForm.get('AreaName')?.hasError('pattern')">Area Name must contain only letters and spaces in between.</div>
      </div>

      <!-- City (CityId) -->
      <div class="row mb-3">
        <label for="cityId" class="col-25 col-form-label">City</label>
        <div class="col-75">
          <select
            formControlName="CityId"
            class="form-control"
            required
          >
            <option value="" disabled>Select a City</option>
            <option *ngFor="let city of cities" [value]="city.CityId">
              {{ city.CityName }}
            </option>
          </select>
        </div>
      </div>
      <div *ngIf="areaForm.get('CityId')?.invalid && areaForm.get('CityId')?.touched" class="text-danger">
        <div *ngIf="areaForm.get('CityId')?.hasError('required')">City is required.</div>
      </div>

      <!-- Pincode -->
      <div class="row mb-3">
        <label for="pincode" class="col-25 col-form-label">Pincode</label>
        <div class="col-75">
          <input
            formControlName="Pincode"
            type="text"
            id="pincode"
            class="form-control"
            placeholder="Pincode"
            required
            pattern="^[0-9]{6}$"
          />
        </div>
      </div>
      <div *ngIf="areaForm.get('Pincode')?.invalid && areaForm.get('Pincode')?.touched" class="text-danger">
        <div *ngIf="areaForm.get('Pincode')?.hasError('required')">Pincode is required.</div>
        <div *ngIf="areaForm.get('Pincode')?.hasError('pattern')">Pincode must be a 6-digit number.</div>
      </div>

     
      <div *ngIf="areaForm.get('IsActive')?.invalid && areaForm.get('IsActive')?.touched" class="text-danger">
        <div *ngIf="areaForm.get('IsActive')?.hasError('required')">Status is required.</div>
      </div>

      <!-- Submit & Close Buttons -->
      <div class="row">
        <div class="col-12 d-flex justify-content-between gap-4">
          <button
            type="submit"
            class="btn btn-primary btn-md"
            [disabled]="areaForm.invalid"
          >
            <i class="fa fa-check"></i> {{ isEditMode ? 'Update' : 'Add' }}
          </button>
          <button
            type="button"
            class="btn btn-warning btn-md"
            (click)="closeForm()"
          >
            <i class="fa fa-close"></i> Close
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Popup Modal (Success/Error) -->
<div *ngIf="showPopup" class="popup">
  <div class="popup-content">
    <p>{{ popupMessage }}</p>
    <button (click)="closePopup()">Close</button>
  </div>
</div>
