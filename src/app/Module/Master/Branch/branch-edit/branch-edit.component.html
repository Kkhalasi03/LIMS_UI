<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Branch Form Modal (Add/Edit) -->
<div class="popup" *ngIf="isFormVisible">
  <div class="popup-content">
    <span class="close" (click)="closeForm()">&times;</span>
    <h2>{{ isEditMode ? 'Edit Branch' : 'Add Branch' }}</h2>
    <hr />
    <form [formGroup]="branchForm" (ngSubmit)="isEditMode ? onSubmit() : onAddSubmit()">
      
      <!-- Branch ID (Readonly in Edit Mode) -->
      <div class="row mb-3">
        <label for="branchId" class="col-25 col-form-label">Branch ID</label>
        <div class="col-75">
          <input
            formControlName="BranchId"
            type="number"
            id="branchId"
            class="form-control"
            placeholder="Branch ID"
            [readonly]="isEditMode"
          />
        </div>
      </div>
      
      <!-- Branch Code -->
      <div class="row mb-3">
        <label for="branchCode" class="col-25 col-form-label">Branch Code</label>
        <div class="col-75">
          <input
            formControlName="BranchCode"
            type="text"
            id="branchCode"
            class="form-control"
            placeholder="Branch Code"
            required
            pattern="^(?!\s*$)[A-Za-z0-9]+(?:[ -][A-Za-z0-9]+)*$"
          />
        </div>
      </div>
      <div *ngIf="branchForm.get('BranchCode')?.invalid && branchForm.get('BranchCode')?.touched" class="text-danger">
        <div *ngIf="branchForm.get('BranchCode')?.hasError('required')">Branch Code is required.</div>
        <div *ngIf="branchForm.get('BranchCode')?.hasError('pattern')">Branch Code must contain only letters, numbers, and spaces in between.</div>
      </div>
  
      <!-- Branch Name -->
      <div class="row mb-3">
        <label for="branchName" class="col-25 col-form-label">Branch Name</label>
        <div class="col-75">
          <input
            formControlName="BranchName"
            type="text"
            id="branchName"
            class="form-control"
            placeholder="Branch Name"
            required
            pattern="^(?!\s*$)[A-Za-z]+(?:[ -][A-Za-z]+)*$"
          />
        </div>
      </div>
      <div *ngIf="branchForm.get('BranchName')?.invalid && branchForm.get('BranchName')?.touched" class="text-danger">
        <div *ngIf="branchForm.get('BranchName')?.hasError('required')">Branch Name is required.</div>
        <div *ngIf="branchForm.get('BranchName')?.hasError('pattern')">Branch Name must contain only letters and spaces in between.</div>
      </div>

      <!-- Submit & Close Buttons -->
      <div class="row">
        <div class="col-12 d-flex justify-content-between gap-4">
          <button
            type="submit"
            class="btn btn-primary btn-md"
            [disabled]="branchForm.invalid"
          >
            <i class="fa fa-check"></i> {{ isEditMode ? 'Update' : 'Add' }}
          </button>
          <button
            type="button"
            class="btn btn-warning btn-md"
            (click)="closeForm()"
          >
            <i class="fa fa-close"></i> Close
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Popup Modal (Success/Error) -->
<div *ngIf="showPopup" class="popup">
  <div class="popup-content">
    <p>{{ popupMessage }}</p>
    <button (click)="closePopup()">Close</button>
  </div>
</div>
