<!-- Ensure Bootstrap Icons are included -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Header Section -->
<div *ngIf="username" class="custom-header d-flex justify-content-between align-items-center">
  <span>Welcome to LIMS</span>
  <div class="dropdown">
    <button class="btn btn-dark dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="fa fa-user"></i> {{ username }}
    </button>
    <ul class="dropdown-menu" aria-labelledby="userDropdown">
      <li>
        <button class="dropdown-item text-danger" (click)="onLogout()">
          <i class="fa fa-power-off"></i> Logout
        </button>
      </li>
    </ul>
  </div>
</div>

<!-- Sidebar -->
<app-sidenav-bar></app-sidenav-bar>

<!-- Dashboard Content -->
<!-- Dashboard Content -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center">
    <h2 class="mb-3">LIMS Dashboard</h2>
    <input 
      type="date" 
      class="form-control w-auto" 
      [formControl]="selectedDate" 
      (change)="onDateChange()"
    />
  </div>

  <div class="row mt-3">
    <div *ngFor="let report of reports" class="col-md-3">
      <div class="card text-white bg-{{ report.color }} mb-3 shadow">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div class="text-left">
            <p class="font-large-1 ng-star-inserted" style="font-size: 2rem;">
              {{ report.count }} <!-- Display large number -->
            </p>
            <!-- Display B2B and B2C only for Total Patients and New Tests -->
            <p class="small" style="font-size: 1.2rem;" *ngIf="report.title === 'Total Patients' || report.title === 'New Tests'">
              B2B: {{ report.B2B }} | B2C: {{ report.B2C }}
            </p>
            <h5 class="card-title mt-2">{{ report.title }}</h5>
          </div>
          <!-- Icon on the right side -->
          <i class="{{ report.icon }} display-4 float-end"></i>
        </div>
      </div>
    </div>
  </div>
</div>
